name: Deploy Gienco a S3 + CloudFront

# Ejecución automática en main y trigger manual para contingencias/rollbacks
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Previene colisiones en S3 cancelando despliegues paralelos obsoletos
concurrency:
  group: "production-deploy"
  cancel-in-progress: true

# Permisos OIDC (Zero Trust) para evitar el uso de Access Keys estáticas
permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build & Deploy to AWS
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Mitiga runners congelados y sobrecostes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (Clean install)
        run: npm ci

      - name: Build project & Inject Secrets
        run: npm run build
        # Resolución de variables de entorno para el empaquetado de Vite
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_USER_POOL_ID: ${{ secrets.VITE_USER_POOL_ID }}
          VITE_USER_POOL_CLIENT_ID: ${{ secrets.VITE_USER_POOL_CLIENT_ID }}
          VITE_LAMBDA_ORDER_URL: ${{ secrets.VITE_LAMBDA_ORDER_URL }}
          VITE_API_ORDERS_URL: ${{ secrets.VITE_API_ORDERS_URL }}
          VITE_BANDSINTOWN_APP_ID: ${{ secrets.VITE_BANDSINTOWN_APP_ID }}

      - name: Configure AWS Credentials (OIDC/STS)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/role-github-actions-gienco
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3 (Cache Strategy)
        run: |
          # Assets inmutables con caché agresiva (1 año) en CDN
          aws s3 sync dist/assets s3://${{ secrets.AWS_S3_BUCKET }}/assets --delete --cache-control "public, max-age=31536000, immutable"
          
          # Entry point (index.html) sin caché para forzar la actualización en el cliente
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET }} --delete --exclude "assets/*" --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        # Purga global de Edge Locations para aplicar los cambios inmediatamente
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_ID }} --paths "/*"
<!DOCTYPE html>
<html lang="es" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Permissions-Policy" content="geolocation=()">
  <meta name="color-scheme" content="dark">

  <!--
    Title y meta (description, canonical, og, twitter) son actualizados por
    ruta desde src/utils/seo.js cuando la app hidrata. Los valores de aquí son
    el fallback estático que leen los crawlers que NO ejecutan JS (WhatsApp,
    Facebook, etc.) y describen la home / la marca.
  -->
  <title>Gienco — Rock n' Roll | Web oficial</title>
  <meta name="description"
    content="Web oficial de Gienco, banda de rock n' roll. Escucha nuestro álbum «Manifiesto», descubre próximos conciertos y consigue el merchandising oficial.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="https://giencoband.com/">

  <!--
    Favicon: logo original restaurado en alta resolución (Gemini) y recortado
    a la forma exacta del original; cada tamaño se genera desde el máster.
  -->
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#000000">

  <!-- Open Graph (WhatsApp, Facebook, LinkedIn...) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Gienco">
  <meta property="og:title" content="Gienco — Rock n' Roll | Web oficial">
  <meta property="og:description" content="Web oficial de Gienco, banda de rock n' roll. Escucha nuestro álbum «Manifiesto» y consigue el merchandising oficial.">
  <meta property="og:url" content="https://giencoband.com/">
  <meta property="og:image" content="https://giencoband.com/favicon-512x512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="Logotipo de Gienco">
  <meta property="og:locale" content="es_ES">

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Gienco — Rock n' Roll | Web oficial">
  <meta name="twitter:description" content="Web oficial de Gienco, banda de rock n' roll. Escucha nuestro álbum «Manifiesto» y consigue el merchandising oficial.">
  <meta name="twitter:image" content="https://giencoband.com/favicon-512x512.png">

  <!-- Structured data: MusicGroup (describe la banda como entidad) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MusicGroup",
    "name": "Gienco",
    "genre": "Rock n' Roll",
    "url": "https://giencoband.com/",
    "image": "https://giencoband.com/favicon-512x512.png",
    "sameAs": [
      "https://open.spotify.com/artist/2SuZxiVemUNCCrzzXZVJg3",
      "https://www.instagram.com/gienco_band/",
      "https://www.youtube.com/@gienco_band"
    ],
    "album": {
      "@type": "MusicAlbum",
      "name": "Manifiesto"
    }
  }
  </script>

  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!--
    Tipografías:
      · Cinzel Decorative — solo wordmark "GIENCO" y títulos de impacto.
      · Manrope — toda la UI (body, navegación, productos, explicaciones).
                  Letterforms redondeadas para lectura cómoda en cuerpos pequeños.
      · Material Symbols Outlined — iconografía.
  -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&display=swap">

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  </noscript>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
